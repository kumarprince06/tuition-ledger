openapi: 3.1.0
info: { title: Tuition Ledger API, version: 0.1.0, description: Multi-tenant SaaS for coaching centres. Centre scope comes from the bearer token. }
servers: [{ url: https://api.tuitionledger.in/v1 }]
security: [{ bearer: [] }]
components:
  securitySchemes: { bearer: { type: http, scheme: bearer, bearerFormat: JWT } }
  parameters:
    IdemKey: { name: Idempotency-Key, in: header, required: false, schema: { type: string, format: uuid } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
    Limit: { name: limit, in: query, schema: { type: integer, maximum: 100, default: 50 } }
  schemas:
    Problem: { type: object, properties: { type: {type: string}, title: {type: string}, status: {type: integer}, detail: {type: string}, errors: { type: array, items: { type: object, properties: { field: {type: string}, message: {type: string} } } } } }
    Money: { type: integer, format: int64, description: paise }
    Student: { type: object, required: [id, name, parentPhone, joinedOn, status], properties: { id: {type: string}, name: {type: string}, class: {type: string}, parentName: {type: string}, parentPhone: {type: string, pattern: '^\+[1-9][0-9]{7,14}$'}, joinedOn: {type: string, format: date}, discountBps: {type: integer, minimum: 0, maximum: 10000}, status: {type: string, enum: [active, paused, left]}, consent: {type: string, enum: [pending, given, opted_out], description: 'per parent phone'}, balancePaise: {$ref: '#/components/schemas/Money'}, batchIds: { type: array, items: {type: string}, description: 'batches with an enrolment active today' }, attendanceRate30d: {type: number, description: 'late counts as attended'} } }
    Batch: { type: object, required: [id, name, feePaise, schedule], properties: { id: {type: string}, name: {type: string}, subject: {type: string}, class: {type: string}, teacherId: {type: string}, feePaise: {$ref: '#/components/schemas/Money'}, capacity: {type: integer}, schedule: { type: object, properties: { days: { type: array, items: { type: string, enum: [MON,TUE,WED,THU,FRI,SAT,SUN] } }, start: {type: string, example: '17:00'}, end: {type: string, example: '18:30'} } }, status: {type: string}, activeStudents: {type: integer}, attendanceRate30d: {type: number}, testsCount: {type: integer}, nextSessionAt: {type: string, format: date-time}, todaySession: {type: string, enum: [none, to_mark, marked]} } }
    AttendanceMark: { type: object, required: [studentId, mark], properties: { studentId: {type: string}, mark: {type: string, enum: [P, A, L]} } }
    Charge: { type: object, properties: { id: {type: string}, studentId: {type: string}, batchId: {type: string}, period: {type: string, example: '2026-10'}, kind: {type: string, enum: [monthly, one_off, adjustment]}, description: {type: string}, grossPaise: {$ref: '#/components/schemas/Money'}, discountPaise: {$ref: '#/components/schemas/Money'}, netPaise: {$ref: '#/components/schemas/Money'}, dueOn: {type: string, format: date}, outstandingPaise: {$ref: '#/components/schemas/Money'}, computation: {type: object} } }
    PaymentRequest: { type: object, required: [studentId, amountPaise, method, receivedOn], properties: { studentId: {type: string}, amountPaise: {$ref: '#/components/schemas/Money'}, method: {type: string, enum: [cash, upi_manual]}, utr: {type: string}, receivedOn: {type: string, format: date}, chargeId: {type: string}, confirmDuplicate: {type: boolean, default: false} } }
    Payment: { type: object, properties: { id: {type: string}, receiptNo: {type: string}, studentId: {type: string}, amountPaise: {$ref: '#/components/schemas/Money'}, method: {type: string}, receivedOn: {type: string, format: date}, allocations: { type: array, items: { type: object, properties: { chargeId: {type: string}, amountPaise: {$ref: '#/components/schemas/Money'} } } }, balanceAfterPaise: {$ref: '#/components/schemas/Money'} } }
    LedgerLine: { type: object, properties: { id: {type: integer}, kind: {type: string}, amountPaise: {$ref: '#/components/schemas/Money'}, runningBalancePaise: {$ref: '#/components/schemas/Money'}, refId: {type: string}, reason: {type: string}, actorId: {type: string}, createdAt: {type: string, format: date-time} } }
    Dashboard: { type: object, properties: { period: {type: string}, duePaise: {$ref: '#/components/schemas/Money'}, collectedPaise: {$ref: '#/components/schemas/Money'}, outstandingPaise: {$ref: '#/components/schemas/Money'}, collectionRate: {type: number}, awaitingConsent: {type: integer}, batches: { type: array, items: { type: object, properties: { batchId: {type: string}, name: {type: string}, attendanceRate: {type: number} } } }, todaySessions: { type: array, items: { type: object } } } }
paths:
  /signup/otp: { post: { security: [], requestBody: { content: { application/json: { schema: { type: object, required: [phone], properties: { phone: {type: string} } } } } }, responses: { '202': { description: code sent on WhatsApp }, '409': { description: phone already belongs to a user, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }, '429': { description: registration limit reached } } } }
  /signup: { post: { security: [], requestBody: { content: { application/json: { schema: { type: object, required: [phone, code, email, password, centreName, ownerName], properties: { phone: {type: string}, code: {type: string, pattern: '^[0-9]{6}$'}, email: {type: string, format: email}, password: {type: string, minLength: 8, format: password}, centreName: {type: string}, ownerName: {type: string}, city: {type: string} } } } } }, responses: { '201': { description: centre and owner created (receipt prefix generated from the name); trial started; tokens, content: { application/json: { schema: { type: object, properties: { accessToken: {type: string}, expiresIn: {type: integer}, centreId: {type: string}, trialEndsOn: {type: string, format: date} } } } } }, '401': { description: wrong code }, '400': { description: validation } } } }
  /centre/whatsapp: { get: { responses: { '200': { description: sender status, content: { application/json: { schema: { type: object, properties: { status: {type: string, enum: [not_connected, pending, connected]}, displayName: {type: string}, heldMessages: {type: integer} } } } } } } } }
  /auth/login: { post: { security: [], requestBody: { content: { application/json: { schema: { type: object, required: [email, password], properties: { email: {type: string, format: email}, password: {type: string, format: password} } } } } }, responses: { '200': { description: tokens; sets refresh cookie, content: { application/json: { schema: { type: object, properties: { accessToken: {type: string}, expiresIn: {type: integer} } } } } }, '401': { description: wrong email or password (one message for both) }, '403': { description: email not verified }, '423': { description: password sign-in locked for 15 minutes } } } }
  /auth/email/verify: { post: { security: [], requestBody: { content: { application/json: { schema: { type: object, required: [token], properties: { token: {type: string} } } } } }, responses: { '204': { description: verified }, '410': { description: link expired or used } } } }
  /auth/password/forgot: { post: { security: [], requestBody: { content: { application/json: { schema: { type: object, properties: { email: {type: string, format: email}, phone: {type: string} } } } } }, responses: { '202': { description: always; a link or code is sent if the account exists } } } }
  /auth/password/reset: { post: { security: [], requestBody: { content: { application/json: { schema: { type: object, required: [password], properties: { token: {type: string}, phone: {type: string}, code: {type: string}, password: {type: string, minLength: 8, format: password} } } } } }, responses: { '204': { description: password set; all sessions revoked }, '400': { description: weak password }, '410': { description: token expired or used } } } }
  /me/credentials: { patch: { requestBody: { content: { application/json: { schema: { type: object, properties: { email: {type: string, format: email}, newPassword: {type: string, minLength: 8, format: password}, currentPassword: {type: string, format: password}, otpCode: {type: string} } } } } }, responses: { '204': { description: updated; other sessions revoked }, '401': { description: current password or code wrong } } } }
  /auth/otp: { post: { security: [], requestBody: { content: { application/json: { schema: { type: object, required: [phone], properties: { phone: {type: string} } } } } }, responses: { '202': { description: sent }, '429': { description: rate limited, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } } } } }
  /auth/verify: { post: { security: [], requestBody: { content: { application/json: { schema: { type: object, required: [phone, code], properties: { phone: {type: string}, code: {type: string, pattern: '^[0-9]{6}$'} } } } } }, responses: { '200': { description: tokens, content: { application/json: { schema: { type: object, properties: { accessToken: {type: string}, expiresIn: {type: integer} } } } } }, '401': { description: wrong code } } } }
  /me: { get: { responses: { '200': { description: current user } } } }
  /students:
    get: { parameters: [ {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, { name: q, in: query, schema: {type: string} }, { name: status, in: query, schema: {type: string} }, { name: batchId, in: query, schema: {type: string} }, { name: hasBalance, in: query, schema: {type: boolean} }, { name: consent, in: query, schema: {type: string, enum: [pending, given, opted_out]} } ], responses: { '200': { description: page, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: '#/components/schemas/Student' } }, nextCursor: {type: string} } } } } } } }
    post: { parameters: [ {$ref: '#/components/parameters/IdemKey'} ], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Student' } } } }, responses: { '201': { description: created }, '402': { description: plan student limit reached }, '400': { description: validation } } }
  /students/{id}: { parameters: [ { name: id, in: path, required: true, schema: {type: string} } ], get: { responses: { '200': { description: student } } }, patch: { requestBody: { content: { application/json: { schema: { type: object, properties: { status: {type: string}, effectiveOn: {type: string, format: date}, reason: {type: string}, discountBps: {type: integer}, parentPhone: {type: string} } } } } }, responses: { '200': { description: updated } } } }
  /students/{id}/ledger: { parameters: [ { name: id, in: path, required: true, schema: {type: string} } ], get: { responses: { '200': { description: lines, content: { application/json: { schema: { type: object, properties: { balancePaise: {$ref: '#/components/schemas/Money'}, lines: { type: array, items: { $ref: '#/components/schemas/LedgerLine' } } } } } } } } } }
  /batches: { get: { responses: { '200': { description: list } } }, post: { requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Batch' } } } }, responses: { '201': { description: created } } } }
  /sessions/{id}/attendance:
    parameters: [ { name: id, in: path, required: true, schema: {type: string} } ]
    get: { responses: { '200': { description: marks } } }
    put: { requestBody: { content: { application/json: { schema: { type: object, required: [marks], properties: { marks: { type: array, items: { $ref: '#/components/schemas/AttendanceMark' } } } } } } }, responses: { '200': { description: saved }, '403': { description: not your batch }, '409': { description: session older than 7 days } } }
  /charges: { get: { parameters: [ { name: studentId, in: query, schema: {type: string} }, { name: period, in: query, schema: {type: string} }, { name: status, in: query, schema: {type: string, enum: [open, paid]} } ], responses: { '200': { description: list } } }, post: { parameters: [ {$ref: '#/components/parameters/IdemKey'} ], requestBody: { content: { application/json: { schema: { type: object, required: [studentId, netPaise, description], properties: { studentId: {type: string}, netPaise: {$ref: '#/components/schemas/Money'}, description: {type: string}, dueOn: {type: string, format: date} } } } } }, responses: { '201': { description: created } } } }
  /fee-runs/{period}/preview: { parameters: [ { name: period, in: path, required: true, schema: {type: string} } ], get: { responses: { '200': { description: charges the run would create; nothing written, content: { application/json: { schema: { type: object, properties: { period: {type: string}, totalPaise: {$ref: '#/components/schemas/Money'}, charges: { type: array, items: { $ref: '#/components/schemas/Charge' } } } } } } } } } }
  /adjustments: { post: { parameters: [ {$ref: '#/components/parameters/IdemKey'} ], requestBody: { content: { application/json: { schema: { type: object, required: [studentId, amountPaise, reason], properties: { studentId: {type: string}, amountPaise: { $ref: '#/components/schemas/Money', description: 'negative = discount or credit' }, reason: {type: string, minLength: 3} } } } } }, responses: { '201': { description: ledger line created, content: { application/json: { schema: { $ref: '#/components/schemas/LedgerLine' } } } } } } }
  /fee-runs/{period}/run: { parameters: [ { name: period, in: path, required: true, schema: {type: string} } ], post: { responses: { '202': { description: started or resumed } } } }
  /payments:
    post: { parameters: [ {$ref: '#/components/parameters/IdemKey'} ], requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/PaymentRequest' } } } }, responses: { '201': { description: recorded, content: { application/json: { schema: { $ref: '#/components/schemas/Payment' } } } }, '200': { description: idempotent replay, headers: { Idempotent-Replay: { schema: {type: boolean} } } }, '409': { description: near-duplicate or duplicate UTR, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } } } }
    get: { parameters: [ { name: studentId, in: query, schema: {type: string} }, { name: from, in: query, schema: {type: string, format: date} }, { name: to, in: query, schema: {type: string, format: date} } ], responses: { '200': { description: list } } }
  /payments/{id}/refund: { parameters: [ { name: id, in: path, required: true, schema: {type: string} } ], post: { parameters: [ {$ref: '#/components/parameters/IdemKey'} ], requestBody: { content: { application/json: { schema: { type: object, required: [amountPaise, reason], properties: { amountPaise: {$ref: '#/components/schemas/Money'}, reason: {type: string} } } } } }, responses: { '201': { description: refund line created } } } }
  /payment-links: { post: { requestBody: { content: { application/json: { schema: { type: object, required: [studentId], properties: { studentId: {type: string}, chargeId: {type: string}, amountPaise: {$ref: '#/components/schemas/Money'} } } } } }, responses: { '201': { description: link, content: { application/json: { schema: { type: object, properties: { id: {type: string}, shortUrl: {type: string}, amountPaise: {$ref: '#/components/schemas/Money'} } } } } }, '402': { description: not in plan } } } }
  /outstanding: { get: { responses: { '200': { description: list of students with outstanding, days overdue, last reminder } } } }
  /reminders/send-now: { post: { requestBody: { content: { application/json: { schema: { type: object, required: [studentId], properties: { studentId: {type: string} } } } } }, responses: { '202': { description: queued }, '429': { description: already sent in last 24 h } } } }
  /dashboard: { get: { responses: { '200': { description: figures, content: { application/json: { schema: { $ref: '#/components/schemas/Dashboard' } } } } } } }
  /reports/statement: { get: { parameters: [ { name: month, in: query, required: true, schema: {type: string} } ], responses: { '200': { description: opening, charges, payments, adjustments, closing; per-student rows } } } }
  /exports/{kind}.csv: { parameters: [ { name: kind, in: path, required: true, schema: { type: string, enum: [ledger, payments, attendance, students] } } ], get: { responses: { '200': { description: CSV stream, content: { text/csv: {} } } } } }
  /subscription: { get: { responses: { '200': { description: plan, usage, limits } } }, patch: { requestBody: { content: { application/json: { schema: { type: object, properties: { planCode: {type: string} } } } } }, responses: { '200': { description: changed }, '409': { description: over the target plan's limits } } } }
  /webhooks/razorpay: { post: { security: [], responses: { '200': { description: accepted (duplicates included) }, '401': { description: bad signature } } } }
  /webhooks/whatsapp: { get: { security: [], responses: { '200': { description: verification challenge } } }, post: { security: [], responses: { '200': { description: accepted } } } }
  /platform/centres: { get: { responses: { '200': { description: centres with counts only } } }, post: { requestBody: { content: { application/json: { schema: { type: object, required: [name, ownerPhone, planCode], properties: { name: {type: string}, ownerPhone: {type: string}, planCode: {type: string} } } } } }, responses: { '201': { description: created } } } }
